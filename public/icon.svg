<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050810" />
      <stop offset="50%" stop-color="#0A1428" />
      <stop offset="100%" stop-color="#04060C" />
    </linearGradient>
    <linearGradient id="electric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D9CFF" />
      <stop offset="100%" stop-color="#7B5CFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#2D9CFF" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Bracket Accents -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#2D9CFF" stroke-width="4" />
  <path d="M 452 100 L 452 60 L 412 60" fill="none" stroke="#2D9CFF" stroke-width="4" />
  <path d="M 60 412 L 60 452 L 100 452" fill="none" stroke="#2D9CFF" stroke-width="4" />
  <path d="M 452 412 L 452 452 L 412 452" fill="none" stroke="#2D9CFF" stroke-width="4" />

  <!-- System Monarch Insignia -->
  <g filter="url(#glow)">
    <!-- Central Sharp Monarch Crest -->
    <path d="M 256 80 L 330 180 L 300 240 L 380 200 L 320 340 L 256 430 L 192 340 L 132 200 L 212 240 L 182 180 Z" 
          fill="none" stroke="url(#electric)" stroke-width="8" stroke-linejoin="miter" stroke-miterlimit="10" />

    <!-- Inner Core Diamond -->
    <polygon points="256,190 290,256 256,322 222,256" fill="#2D9CFF" fill-opacity="0.3" stroke="#2DFFB0" stroke-width="3" />
    <circle cx="256" cy="256" r="8" fill="#FFFFFF" />

    <!-- Wing Flares -->
    <path d="M 132 200 L 70 260 L 120 280" fill="none" stroke="#2D9CFF" stroke-width="4" />
    <path d="M 380 200 L 442 260 L 392 280" fill="none" stroke="#2D9CFF" stroke-width="4" />
  </g>

  <!-- System Subtext -->
  <text x="256" y="475" text-anchor="middle" font-family="'Orbitron', sans-serif" font-weight="800" font-size="28" fill="#2D9CFF" letter-spacing="8">[ SYSTEM ]</text>
</svg>
